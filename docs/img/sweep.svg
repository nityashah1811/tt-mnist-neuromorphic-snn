<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Accuracy vs. size: why the chip is a single layer">
<title>Accuracy vs. size: why the chip is a single layer</title>
<rect width="1000" height="290" rx="12" fill="#0d1117"/>
<text x="30" y="36" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Accuracy vs. size: why the chip is a single layer</text>
<text x="30" y="57" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">MNIST test accuracy of each network the training sweep tried, and where it would fit.</text>
<line x1="250.0" y1="78" x2="250.0" y2="264" stroke="#30363d"/>
<text x="250.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0%</text>
<line x1="354.0" y1="78" x2="354.0" y2="264" stroke="#30363d"/>
<text x="354.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">20%</text>
<line x1="458.0" y1="78" x2="458.0" y2="264" stroke="#30363d"/>
<text x="458.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">40%</text>
<line x1="562.0" y1="78" x2="562.0" y2="264" stroke="#30363d"/>
<text x="562.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">60%</text>
<line x1="666.0" y1="78" x2="666.0" y2="264" stroke="#30363d"/>
<text x="666.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">80%</text>
<line x1="770.0" y1="78" x2="770.0" y2="264" stroke="#30363d"/>
<text x="770.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">100%</text>
<text x="236" y="105" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8×8 → 10</text>
<path d="M250 90h408.4a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-408.4z" fill="#3987e5"/>
<text x="672.36" y="105" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">79.3%  ·  1x1  ✓ chip</text>
<text x="236" y="141" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8×8 → 16 → 10</text>
<path d="M250 126h424.5a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-424.5z" fill="#2d4a6e"/>
<text x="688.48" y="141" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">82.4%  ·  too big for 1x1</text>
<text x="236" y="177" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8×8 → 24 → 10</text>
<path d="M250 162h447.4a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-447.4z" fill="#2d4a6e"/>
<text x="711.36" y="177" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">86.8%  ·  1x2 tiles</text>
<text x="236" y="213" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">10×10 → 10</text>
<path d="M250 198h453.1a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-453.1z" fill="#2d4a6e"/>
<text x="717.08" y="213" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">87.9%  ·  1x1, too full</text>
<text x="236" y="249" font-size="13" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8×8 → 32 → 10</text>
<path d="M250 234h450.0a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-450.0z" fill="#2d4a6e"/>
<text x="713.96" y="249" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">87.3%  ·  1x2+ tiles</text>
</svg>