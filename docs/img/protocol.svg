<text x="186.44444444444446" y="420" font-size="12" fill="#c9d1d9" text-anchor="start" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">③ BUSY = 0: send the next byte. After 16 × 8 bytes, DONE = 1 and uo[3:0] holds the digit</text>
